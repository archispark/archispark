{{- if .Values.ingress.enabled }}
# ── Ingress : / → server:8000 (catch-all) ───────────────────────────────────
# One process (apps/server, Next.js) now serves the web UI, the REST API
# (/api/*) and the MCP transport (/mcp/*) — no more per-service path
# splitting/rewriting (the old /api strip-prefix + /auth, /mcp passthrough
# rules are gone, since apps/api and apps/mcp-server no longer exist).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "archispark.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "archispark.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "archispark.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "archispark.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
{{- end }}
