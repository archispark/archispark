# ─────────────────────────────────────────────────────────────────────────────
#  ArchiSpark — Docker Compose (dev local / pnpm)
#
#  Lance uniquement l'infrastructure. L'application tourne en local via pnpm :
#
#    pnpm start       # démarre l'infra complète, puis pnpm dev
#                      # (apps/server avec hot-reload : web, API REST et MCP)
#
#  Postgres démarre toujours (base partagée par tout le reste). Les autres
#  services sont rattachés à un profil et ne démarrent que si on l'active
#  explicitement, ou s'ils sont dépendance d'un service dont le profil est
#  actif (ex: `--profile auth` démarre aussi mailpit, dont keycloak dépend) :
#
#    mailpit   → profil "mail"
#    keycloak  → profil "auth"  (dépend de "mail")
#    neo4j     → profil "neo4j"
#
#  Raccourcis pnpm (voir package.json) :
#
#    pnpm infra:up         # tout (comportement historique)
#    pnpm infra:up:db      # postgres seul
#    pnpm infra:up:mail    # postgres + mailpit
#    pnpm infra:up:auth    # postgres + mailpit + keycloak
#    pnpm infra:up:neo4j   # postgres + neo4j
#
#  Équivalent manuel, ex. postgres + neo4j uniquement :
#    docker compose -f .docker/docker-compose.yml --profile neo4j up -d --wait
#
#  Arrêt (en conservant les données) — toujours avec tous les profils, pour
#  arrêter l'ensemble des conteneurs quel que soit le sous-ensemble démarré :
#    pnpm infra:down
#
#  Arrêt + suppression des volumes :
#    docker compose -f .docker/docker-compose.yml --profile auth --profile mail --profile neo4j down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de données (Postgres) ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     archispark
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archispark}
      POSTGRES_DB:       archispark
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Script d'initialisation : crée la base archispark_keycloak au premier démarrage
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U archispark -d archispark"]
      interval: 5s
      timeout:  5s
      retries:  10
  
  # ── Base de données (Neo4j) ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    ports:
      - '7474:7474' # Neo4j Browser
      - '7687:7687' # Bolt (apps/server, NEO4J_URI=bolt://localhost:7687)
    environment:
      NEO4J_AUTH: none
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Local e-mail inbox (SMTP + web UI) ───────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # keycloak (profil "auth") en dépend : rattaché aussi à "auth" pour que
    # `--profile auth` seul suffise (profiles inactifs référencés par
    # depends_on ne sont pas démarrés implicitement par Compose).
    profiles: ["mail", "auth"]
    ports:
      - "1025:1025" # SMTP for apps/server running on the host
      - "8025:8025" # Mailpit web UI

  # ── Identity (Keycloak) ───────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    restart: unless-stopped
    profiles: ["auth"]
    command: start-dev --import-realm
    environment:
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://postgres:5432/archispark_keycloak
      KC_DB_USERNAME: archispark
      KC_DB_PASSWORD: ${DB_PASSWORD:-archispark}
      KC_HOSTNAME:        localhost
      KC_HOSTNAME_PORT:   "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED:    "true"
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      # Realm import: clients, roles and demo users for local dev.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:     ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout:  5s
      retries:  30
      start_period: 30s

volumes:
  postgres_dev_data:
