version: 2

updates:
  # Root (turbo, typescript, prettier)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tooling:
        patterns: ["turbo", "typescript", "prettier*", "@workspace/*"]

  # Server (web + API REST + MCP)
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
    groups:
      server-deps:
        patterns: ["*"]
        exclude-patterns: ["@types/*"]
      server-types:
        patterns: ["@types/*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
