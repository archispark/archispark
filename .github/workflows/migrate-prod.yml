name: Run production migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/db/drizzle-pg/**"
      - "packages/db-neo4j/src/schema/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # migrate-prod.ts / backfill-prod.ts import "@workspace/env" by its
      # package specifier, which resolves to dist/index.js — unbuilt by a
      # plain install, and the previous incarnation of this workflow ran
      # migrate:prod straight after install and failed on every run with
      # ERR_MODULE_NOT_FOUND before anyone noticed (no failure notification
      # wired up).
      - name: Build @workspace/env
        run: pnpm --filter @workspace/env build

      - name: Run pending PostgreSQL migrations
        run: pnpm --filter @workspace/db migrate:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Run organization backfill
        run: pnpm --filter @workspace/db backfill:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Run pending Neo4j migrations
        run: pnpm --filter @workspace/db-neo4j migrate:prod
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
