name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server and workspace dependencies
        run: pnpm turbo run build --filter=server
        env:
          NODE_ENV: production
          DB_CLIENT: pglite

      - name: Run CI Tasks (Lint, Typecheck, Test)
        run: pnpm turbo run lint typecheck test:coverage --filter=server
        env:
          NODE_ENV: test

      - name: Upload server coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-server
          path: apps/server/coverage/
          retention-days: 7

      - name: server coverage summary
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          name: server
          working-directory: apps/server
